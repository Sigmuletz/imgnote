<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>imgnote</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="palette">
      <div id="palette-header">
        <input id="palette-filter" type="text" placeholder="Filter files…" autocomplete="off" spellcheck="false">
      </div>
      <div id="palette-list"></div>
    </aside>

    <main id="viewport">
      <div id="grid-layer"></div>
      <div id="canvas">
        <div id="frame-layer"></div>
        <svg id="line-layer" viewBox="-50000 -50000 100000 100000" preserveAspectRatio="none"></svg>
        <svg id="hull-layer" viewBox="-50000 -50000 100000 100000" preserveAspectRatio="none"></svg>
      </div>
      <div id="marquee" hidden></div>
    </main>

    <!-- Right-hand dock, mirroring #palette. Shown only while a line is
         selected; it takes a grid column, so it pushes the viewport rather
         than covering the board it is describing. -->
    <aside id="rules-panel" hidden>
      <div id="rules-head">
        <div id="rules-title">LINE</div>
        <div id="rules-ends"></div>
      </div>

      <div id="rules-readout">
        <span>dx <b id="rules-dx">0</b></span>
        <span>dy <b id="rules-dy">0</b></span>
      </div>

      <div id="rules-list"></div>

      <div id="rules-foot">
        <select id="rules-attach" title="Attach a rule from the library"></select>
        <button id="rules-new" type="button" title="New rule around this line's current offset">new rule</button>
        <button id="rules-swap" type="button" title="Swap which end is the origin (S)">&#8644; swap ends</button>
      </div>
    </aside>

    <div id="toolbar">
      <div class="toolbar-group">
        <label for="grid-size">Grid</label>
        <input id="grid-size" type="number" min="2" step="1" value="32">
      </div>

      <label class="toolbar-group">
        <input id="show-grid" type="checkbox" checked>
        Show grid
      </label>

      <button id="theme-toggle" type="button" title="Toggle theme">Light</button>

      <button id="paste-image" type="button" title="Paste an image from the clipboard and slice it (Ctrl+V)">Paste image…</button>

      <button id="add-frame" type="button" title="Add a frame around the selection, or in the middle of the view (Ctrl+B)">Frame</button>

      <button id="line-tool" type="button" title="Line tool: click two icons to connect them (L)">Line</button>

      <div class="toolbar-group align-group" id="align-group">
        <button id="align-left" type="button" title="Align left" disabled>&#8676;</button>
        <button id="align-center-x" type="button" title="Align center (horizontal)" disabled>&#8596;</button>
        <button id="align-right" type="button" title="Align right" disabled>&#8677;</button>
        <button id="align-top" type="button" title="Align top" disabled>&#8670;</button>
        <button id="align-center-y" type="button" title="Align center (vertical)" disabled>&#8597;</button>
        <button id="align-bottom" type="button" title="Align bottom" disabled>&#8671;</button>
        <button id="distribute-x" type="button" title="Distribute horizontally" disabled>&#8633;</button>
        <button id="distribute-y" type="button" title="Distribute vertically" disabled>&#8634;</button>
      </div>
    </div>

    <div id="statusbar"></div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
