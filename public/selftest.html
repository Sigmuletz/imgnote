<!doctype html>
<meta charset="utf-8">
<title>imgnote selftest</title>
<link rel="stylesheet" href="/style.css">
<style>#results{position:fixed;inset:0;z-index:99999;background:#111;color:#ddd;font:12px/1.5 monospace;padding:12px;overflow:auto;white-space:pre}</style>
<div id="app">
  <aside id="palette">
    <input id="palette-filter" placeholder="filter">
    <div id="palette-list"></div>
  </aside>
  <main id="viewport">
    <div id="grid-layer"></div>
    <div id="canvas"><div id="frame-layer"></div><svg id="line-layer" viewBox="-50000 -50000 100000 100000" preserveAspectRatio="none"></svg><svg id="hull-layer" viewBox="-50000 -50000 100000 100000" preserveAspectRatio="none"></svg></div>
    <div id="marquee" hidden></div>
  </main>
  <div id="toolbar">
    <input id="grid-size" type="number" value="32">
    <input id="show-grid" type="checkbox" checked>
    <button id="theme-toggle">theme</button>
    <button id="add-frame">frame</button>
    <button id="line-tool">line</button>
  </div>
  <div id="statusbar"></div>
</div>
<pre id="results">booting…</pre>
<script type="module">
// Synthetic pointer events carry ids the browser never issued, so capture calls
// would throw. Capture only affects event routing, and we dispatch directly.
Element.prototype.setPointerCapture = function () {};
Element.prototype.releasePointerCapture = function () {};

const out = [];
let pass = 0, fail = 0;
const flush = () => { document.getElementById('results').textContent = out.join('\n'); };
const note = m => { out.push(`..    ${m}`); flush(); };
const ok = (name, cond, detail = '') => {
  (cond ? pass++ : fail++);
  out.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? '  — ' + detail : ''}`);
  flush();
};
// rAF can stall in headless; fall back on a timer so a test never hangs forever.
// Wait for a real animation frame. Headless virtual time can starve rAF, so
// there is a generous timeout fallback -- but it must be long enough that rAF
// wins under normal conditions, or drag code that runs in rAF never executes.
const frame = () => new Promise(r => {
  let done = false;
  const fin = () => { if (!done) { done = true; r(); } };
  requestAnimationFrame(() => requestAnimationFrame(fin));
  setTimeout(fin, 1000);
});

out.push('boot: module running'); flush();
let A;
try {
  A = await import('/app.js');
  note(`app.js imported (${Object.keys(A).length} exports)`);
  await import('/drag.js');
  note('drag.js imported');
} catch (e) { out.push('FAIL  import threw: ' + (e && e.stack || e)); flush(); throw e; }

// wait for boot (palette populated by app.js after fetch /files)
for (let i = 0; i < 200 && document.querySelectorAll('.palette-item').length === 0; i++) {
  await new Promise(r => setTimeout(r, 25));
}
note(`boot settled: ${document.querySelectorAll('.palette-item').length} palette items, ${A.state.items.length} board items`);

const vp = document.getElementById('viewport');
const pt = (wx, wy) => { const s = A.worldToScreen(wx, wy); return { clientX: s.x, clientY: s.y }; };
const ev = (type, target, opts) => target.dispatchEvent(new PointerEvent(type, {
  bubbles: true, cancelable: true, pointerId: 1, isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1, ...opts,
}));

async function dragFrom(itemEl, fromW, toW, opts = {}) {
  const a = pt(fromW.x, fromW.y), b = pt(toW.x, toW.y);
  ev('pointerdown', itemEl, { ...a, ...opts });
  await frame();
  ev('pointermove', vp, { ...b, ...opts });
  await frame();
  ev('pointerup', vp, { ...b, ...opts });
  await frame();
}
const el = id => document.querySelector(`.item[data-id="${id}"]`);
const byId = id => A.state.items.find(i => i.id === id);

try {
  // --- boot ---------------------------------------------------------------
  ok('palette lists 15 files', document.querySelectorAll('.palette-item').length === 15,
     `got ${document.querySelectorAll('.palette-item').length}`);
  ok('board starts empty', A.state.items.length === 0, `got ${A.state.items.length}`);
  ok('grid default 32', A.state.grid === 32);

  // --- snap math ----------------------------------------------------------
  const d = A.snapDelta(41, 23);
  ok('snapDelta(41,23) -> (32,32)', d.dx === 32 && d.dy === 32, JSON.stringify(d));
  ok('snap(137) -> 128', A.snap(137) === 128, String(A.snap(137)));

  // --- build a group ------------------------------------------------------
  const a = A.addInstance('sun.png', 0, 0);
  const b = A.addInstance('cloud.png', 64, 0);
  const c = A.addInstance('star.png', 0, 64);
  A.render();
  await frame();
  ok('three instances added', A.state.items.length === 3);

  A.setSelection([a.id, b.id, c.id]);
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'g', ctrlKey: true, bubbles: true }));
  await frame();
  const g = byId(a.id).group;
  ok('Ctrl+G assigns one group to all', !!g && byId(b.id).group === g && byId(c.id).group === g, `group=${g}`);

  // --- group drag: delta snapped once, offsets preserved ------------------
  const before = [a, b, c].map(i => ({ ...byId(i.id) }));
  A.setSelection([a.id]);
  ok('selecting one member selects whole group', A.state.selection.size === 3, `size=${A.state.selection.size}`);

  await dragFrom(el(a.id), { x: 0, y: 0 }, { x: 41, y: 23 });
  const after = [a, b, c].map(i => ({ ...byId(i.id) }));
  const dx = after[0].x - before[0].x, dy = after[0].y - before[0].y;
  ok('group drag snaps delta to (32,32)', dx === 32 && dy === 32, `got (${dx},${dy})`);
  const sameDelta = after.every((it, i) => it.x - before[i].x === dx && it.y - before[i].y === dy);
  ok('all members moved by identical delta', sameDelta);
  const relBefore = JSON.stringify(before.map(i => [i.x - before[0].x, i.y - before[0].y]));
  const relAfter = JSON.stringify(after.map(i => [i.x - after[0].x, i.y - after[0].y]));
  ok('relative offsets unchanged', relBefore === relAfter, `${relBefore} vs ${relAfter}`);
  ok('positions land on grid', after.every(i => i.x % 32 === 0 && i.y % 32 === 0));

  // --- duplicate a group --------------------------------------------------
  const nBefore = A.state.items.length;
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'd', ctrlKey: true, bubbles: true }));
  await frame();
  ok('Ctrl+D duplicates 3 items', A.state.items.length === nBefore + 3, `got ${A.state.items.length}`);
  const copies = A.state.items.slice(-3);
  const newG = copies[0].group;
  ok('copy is a new independent group', !!newG && newG !== g && copies.every(i => i.group === newG), `old=${g} new=${newG}`);
  const relCopy = JSON.stringify(copies.map(i => [i.x - copies[0].x, i.y - copies[0].y]));
  ok('copy keeps internal offsets', relCopy === relAfter, `${relCopy} vs ${relAfter}`);
  ok('copy is selected after duplicate', copies.every(i => A.state.selection.has(i.id)));

  // --- marquee ------------------------------------------------------------
  A.setSelection([]);
  const lo = pt(-500, -500), hi = pt(1200, 1200);
  ev('pointerdown', vp, lo);
  await frame();
  ev('pointermove', vp, hi);
  await frame();
  ev('pointerup', vp, hi);
  await frame();
  ok('marquee selects everything it touches', A.state.selection.size === A.state.items.length,
     `${A.state.selection.size}/${A.state.items.length}`);
  ok('marquee hidden after release', document.getElementById('marquee').hidden);

  // --- alt+drag duplicates ------------------------------------------------
  A.setSelection([a.id]);
  const nAlt = A.state.items.length;
  const pos = byId(a.id);
  await dragFrom(el(a.id), { x: pos.x, y: pos.y }, { x: pos.x + 64, y: pos.y }, { altKey: true });
  ok('Alt+drag duplicates the group', A.state.items.length === nAlt + 3, `got ${A.state.items.length}`);
  ok('Alt+drag leaves originals in place', byId(a.id).x === pos.x && byId(a.id).y === pos.y);

  // --- undo ---------------------------------------------------------------
  const nUndo = A.state.items.length;
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true }));
  await frame();
  ok('one Ctrl+Z undoes the Alt+drag duplicate', A.state.items.length === nUndo - 3, `got ${A.state.items.length}`);
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, shiftKey: true, bubbles: true }));
  await frame();
  ok('redo restores it', A.state.items.length === nUndo, `got ${A.state.items.length}`);

  // --- ungroup ------------------------------------------------------------
  A.setSelection([a.id]);
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'G', ctrlKey: true, shiftKey: true, bubbles: true }));
  await frame();
  ok('Ctrl+Shift+G clears group', byId(a.id).group == null, `group=${byId(a.id).group}`);

  // --- delete never touches disk -----------------------------------------
  A.setSelection([a.id]);
  const nDel = A.state.items.length;
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Delete', bubbles: true }));
  await frame();
  ok('Delete removes the instance', A.state.items.length === nDel - 1, `got ${A.state.items.length}`);
  const files = await (await fetch('/files')).json();
  ok('Delete left all 15 files on disk', files.files.length === 15, `got ${files.files.length}`);

  // --- missing file placeholder ------------------------------------------
  const ghost = A.addInstance('deleted-from-disk.png', 256, 256);
  A.render();
  await frame();
  ok('missing src renders as placeholder', el(ghost.id)?.classList.contains('missing'));

  // --- save round-trip ----------------------------------------------------
  A.markDirty();
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 's', ctrlKey: true, bubbles: true }));
  for (let i = 0; i < 100 && A.state.dirty; i++) await new Promise(r => setTimeout(r, 25));
  ok('Ctrl+S clears the dirty flag', A.state.dirty === false);
  const reloaded = await (await fetch('/files')).json();
  ok('layout persisted to disk', !!reloaded.layout && Array.isArray(reloaded.layout.items),
     reloaded.layout ? `items=${reloaded.layout.items.length}` : 'layout=null');
  ok('persisted grid matches state', reloaded.layout?.grid === A.state.grid);
  ok('persisted item count matches', reloaded.layout?.items.length === A.state.items.length,
     `${reloaded.layout?.items.length} vs ${A.state.items.length}`);

  // --- palette drag-out ---------------------------------------------------
  A.setSelection([]);
  const nPal = A.state.items.length;
  // app.js rebuilds the palette DOM on every render(), so never hold a stale node
  const gearEl = () => document.querySelector('.palette-item[data-src="gear.png"]');
  const src = gearEl();
  const dest = pt(512, 320); // {clientX, clientY}
  const srcRect = src.getBoundingClientRect();
  const from = { clientX: srcRect.left + srcRect.width / 2, clientY: srcRect.top + srcRect.height / 2 };
  ev('pointerdown', src, from);
  await frame();
  ev('pointermove', vp, { clientX: dest.clientX, clientY: dest.clientY });
  await frame();
  ev('pointerup', vp, { clientX: dest.clientX, clientY: dest.clientY });
  await frame();
  ok('palette drag-out spawns an instance', A.state.items.length === nPal + 1, `got ${A.state.items.length}`);
  const spawned = A.state.items[A.state.items.length - 1];
  ok('spawned instance has the dragged src', spawned?.src === 'gear.png', String(spawned?.src));
  ok('spawned instance is snapped to grid', spawned.x % 32 === 0 && spawned.y % 32 === 0, `(${spawned.x},${spawned.y})`);
  ok('palette still lists 15 files after spawn', document.querySelectorAll('.palette-item').length === 15);

  // duplicate the same file again -> two independent instances of one image
  const nPal2 = A.state.items.length;
  ev('pointerdown', gearEl(), from);
  await frame();
  ev('pointermove', vp, { clientX: dest.clientX + 100, clientY: dest.clientY });
  await frame();
  ev('pointerup', vp, { clientX: dest.clientX + 100, clientY: dest.clientY });
  await frame();
  const gears = A.state.items.filter(i => i.src === 'gear.png');
  ok('same image can appear multiple times', gears.length === 2, `gear instances=${gears.length}`);
  ok('the two instances have distinct ids', gears[0].id !== gears[1].id);

  // --- palette drag-out, cancelled ---------------------------------------
  const nCancel = A.state.items.length;
  ev('pointerdown', gearEl(), from);
  await frame();
  ev('pointermove', vp, { clientX: dest.clientX, clientY: dest.clientY });   // out over canvas
  await frame();
  ev('pointermove', vp, from);                                    // back over palette
  await frame();
  ev('pointerup', vp, from);
  await frame();
  ok('cancelled drag-out leaves no instance', A.state.items.length === nCancel, `got ${A.state.items.length}`);
  // net-zero history: one undo must remove the PREVIOUS real action (the 2nd gear),
  // not merely replay the cancelled gesture.
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true }));
  await frame();
  ok('cancelled drag-out costs no undo step', A.state.items.length === nCancel - 1, `got ${A.state.items.length}`);
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, shiftKey: true, bubbles: true }));
  await frame();

  // --- zoom ---------------------------------------------------------------
  const z0 = A.state.view.zoom;
  vp.dispatchEvent(new WheelEvent('wheel', { deltaY: -200, ctrlKey: true, bubbles: true, cancelable: true, clientX: 600, clientY: 400 }));
  await frame();
  ok('Ctrl+wheel zooms in', A.state.view.zoom > z0, `${z0} -> ${A.state.view.zoom}`);
  for (let i = 0; i < 12; i++) vp.dispatchEvent(new WheelEvent('wheel', { deltaY: -400, ctrlKey: true, bubbles: true, cancelable: true, clientX: 600, clientY: 400 }));
  await frame();
  ok('zoom clamps at 4x', A.state.view.zoom <= 4.0001, String(A.state.view.zoom));

  // --- slicer: clipboard import -------------------------------------------
  const SL = await import('/slice.js');
  note('slice.js imported');

  // A 64x32 source: left half opaque red, right half opaque blue, so an
  // exported slice can be checked by its pixels, not just its size.
  const slSrc = document.createElement('canvas');
  slSrc.width = 64; slSrc.height = 32;
  const slCtx = slSrc.getContext('2d');
  slCtx.fillStyle = '#ff0000'; slCtx.fillRect(0, 0, 32, 32);
  slCtx.fillStyle = '#0000ff'; slCtx.fillRect(32, 0, 32, 32);
  const slBlob = await new Promise(r => slSrc.toBlob(r, 'image/png'));

  SL.openSlicer(slBlob);
  for (let i = 0; i < 100 && !SL.isOpen(); i++) await new Promise(r => setTimeout(r, 20));
  ok('paste opens the slicer', SL.isOpen());
  ok('slicer overlay is visible', document.querySelector('.slicer-overlay')?.hidden === false);
  ok('slicer reads the image size', SL._internals.S.w === 64 && SL._internals.S.h === 32,
     `${SL._internals.S.w}x${SL._internals.S.h}`);
  ok('one uncut image is one slice', SL._internals.selectedCells().length === 1);

  // even split
  SL._internals.splitEvenly(2, 2);
  await frame();
  ok('2x2 split yields 4 slices', SL._internals.selectedCells().length === 4,
     `got ${SL._internals.selectedCells().length}`);
  ok('2x2 split draws 2 guides', document.querySelectorAll('.slicer-guide').length === 2,
     `got ${document.querySelectorAll('.slicer-guide').length}`);
  const slC00 = SL._internals.selectedCells()[0];
  ok('slice geometry is exact', slC00.x === 0 && slC00.y === 0 && slC00.w === 32 && slC00.h === 16,
     `${slC00.x},${slC00.y} ${slC00.w}x${slC00.h}`);

  // deselect one cell by clicking it
  const slCells = () => [...document.querySelectorAll('.slicer-cell')];
  ev('pointerdown', slCells()[3], {});
  window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1 }));
  await frame();
  ok('clicking a slice excludes it', SL._internals.selectedCells().length === 3,
     `got ${SL._internals.selectedCells().length}`);
  ok('excluded slice is marked in the UI', slCells()[3].classList.contains('off'));

  // a new cut must not scramble which slCells were excluded
  SL._internals.addGuide('v', 40);
  await frame();
  const slSel = SL._internals.selectedCells();
  // r1c2 (x 32..64, centre x=48) split into 32..40 and 40..64; the exclusion
  // must follow the centre into 40..64, not stay pinned to the cell index.
  ok('adding a cut keeps the exclusion anchored',
     slSel.length === 5 && !slSel.some(c => c.r === 1 && c.x === 40),
     `selected=${slSel.length}, row2 x=${slSel.filter(c => c.r === 1).map(c => c.x).join('/')}`);

  // Reopen for the import round-trip: a fresh paste resets cuts and exclusions.
  SL.openSlicer(slBlob);
  for (let i = 0; i < 100 && !SL.isOpen(); i++) await new Promise(r => setTimeout(r, 20));
  SL._internals.splitEvenly(2, 2);
  await frame();
  ok('reopening resets the previous exclusions', SL._internals.selectedCells().length === 4,
     `got ${SL._internals.selectedCells().length}`);
  document.getElementById('slicer-prefix').value = 'zzslicetest';
  document.getElementById('slicer-prefix').dispatchEvent(new Event('input', { bubbles: true }));
  await frame();
  ok('names follow the prefix', SL._internals.stemFor(0, 0) === 'zzslicetest-r1c1',
     SL._internals.stemFor(0, 0));

  // rename one slice by hand
  const slNameInput = document.querySelectorAll('.slicer-list-name')[1];
  slNameInput.value = 'zzslicetest-custom';
  slNameInput.dispatchEvent(new Event('input', { bubbles: true }));
  ok('a slice can be renamed', SL._internals.stemFor(0, 1) === 'zzslicetest-custom',
     SL._internals.stemFor(0, 1));

  const nFilesBefore = A.state.files.size;
  await SL._internals.doImport();
  for (let i = 0; i < 100 && SL.isOpen(); i++) await new Promise(r => setTimeout(r, 20));
  ok('import closes the slicer', !SL.isOpen());

  const slAfter = await (await fetch('/files')).json();
  const slImported = slAfter.files.filter(f => f.name.startsWith('zzslicetest'));
  ok('import wrote every selected slice', slImported.length === 4, `got ${slImported.length}`);
  ok('import used the custom name', slImported.some(f => f.name === 'zzslicetest-custom.png'),
     slImported.map(f => f.name).join(','));
  ok('import used the auto names', slImported.some(f => f.name === 'zzslicetest-r2c2.png'));
  ok('palette picked up the new files without a reload',
     A.state.files.size === nFilesBefore + 4 && A.state.files.has('zzslicetest-r1c1.png'),
     `files=${A.state.files.size}`);
  ok('new files are draggable palette entries',
     !!document.querySelector('.palette-item[data-src="zzslicetest-r1c1.png"]'));
  ok('import left the original files alone', slAfter.files.filter(f => f.name === 'sun.png').length === 1);

  // the written bytes must be the right crop, at the right size
  // A missing file must fail the assertion, not stall the suite forever.
  const loadImg = (url) => new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error(`could not load ${url}`));
    setTimeout(() => rej(new Error(`timed out loading ${url}`)), 5000);
    im.src = url;
  });
  const slProbe = await loadImg('/img/zzslicetest-r1c1.png');
  ok('slice has the cell dimensions', slProbe.naturalWidth === 32 && slProbe.naturalHeight === 16,
     `${slProbe.naturalWidth}x${slProbe.naturalHeight}`);
  const slPc = document.createElement('canvas');
  slPc.width = slProbe.naturalWidth; slPc.height = slProbe.naturalHeight;
  slPc.getContext('2d').drawImage(slProbe, 0, 0);
  const slPx = slPc.getContext('2d').getImageData(4, 4, 1, 1).data;
  ok('top-left slice carries the top-left pixels', slPx[0] > 200 && slPx[2] < 60, `rgb(${slPx[0]},${slPx[1]},${slPx[2]})`);

  const slProbe2 = await loadImg('/img/zzslicetest-custom.png');
  const slPc2 = document.createElement('canvas');
  slPc2.width = 32; slPc2.height = 16;
  slPc2.getContext('2d').drawImage(slProbe2, 0, 0);
  const slPx2 = slPc2.getContext('2d').getImageData(4, 4, 1, 1).data;
  ok('the right-hand slice carries the right-hand pixels', slPx2[2] > 200 && slPx2[0] < 60,
     `rgb(${slPx2[0]},${slPx2[1]},${slPx2[2]})`);

  // resize option
  SL.openSlicer(slBlob);
  for (let i = 0; i < 100 && !SL.isOpen(); i++) await new Promise(r => setTimeout(r, 20));
  document.getElementById('slicer-resize').checked = true;
  document.getElementById('slicer-resize-w').value = '24';
  document.getElementById('slicer-resize-h').value = '24';
  document.getElementById('slicer-prefix').value = 'zzslicetestfixed';
  document.getElementById('slicer-prefix').dispatchEvent(new Event('input', { bubbles: true }));
  await SL._internals.doImport();
  for (let i = 0; i < 100 && SL.isOpen(); i++) await new Promise(r => setTimeout(r, 20));
  const slProbe3 = await loadImg('/img/zzslicetestfixed.png');
  ok('resize writes slices at the requested size',
     slProbe3.naturalWidth === 24 && slProbe3.naturalHeight === 24, `${slProbe3.naturalWidth}x${slProbe3.naturalHeight}`);

  // importing the same names again must not clobber what is already there
  SL.openSlicer(slBlob);
  for (let i = 0; i < 100 && !SL.isOpen(); i++) await new Promise(r => setTimeout(r, 20));
  document.getElementById('slicer-prefix').value = 'zzslicetestfixed';
  document.getElementById('slicer-prefix').dispatchEvent(new Event('input', { bubbles: true }));
  await SL._internals.doImport();
  for (let i = 0; i < 100 && SL.isOpen(); i++) await new Promise(r => setTimeout(r, 20));
  const slAfter2 = await (await fetch('/files')).json();
  ok('a name clash is written alongside, never over',
     slAfter2.files.some(f => f.name === 'zzslicetestfixed-2.png')
     && slAfter2.files.some(f => f.name === 'zzslicetestfixed.png'),
     slAfter2.files.filter(f => f.name.startsWith('zzslicetestfixed')).map(f => f.name).join(','));

  // Esc closes without importing, and app.js must not see the key
  SL.openSlicer(slBlob);
  for (let i = 0; i < 100 && !SL.isOpen(); i++) await new Promise(r => setTimeout(r, 20));
  const nItemsEsc = A.state.items.length;
  A.setSelection(A.state.items.map(it => it.id));
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await frame();
  ok('Esc closes the slicer', !SL.isOpen());
  const slAfter3 = await (await fetch('/files')).json();
  ok('Esc imports nothing', slAfter3.files.length === slAfter2.files.length,
     `${slAfter2.files.length} -> ${slAfter3.files.length}`);
  ok('slicer keys do not leak to the board', A.state.selection.size === A.state.items.length);
  ok('board items untouched by the slicer', A.state.items.length === nItemsEsc);

  // ---- frames -------------------------------------------------------------
  note('frames');
  A.state.grid = 32;
  A.setSelection([]);
  const fr = A.addFrame();
  ok('addFrame creates one frame', A.state.frames.length === 1, `got ${A.state.frames.length}`);
  ok('new frame has a default title', fr.title === 'Frame', String(fr.title));
  ok('new frame is selected', A.state.frameSelection.has(fr.id));

  // the frame layer must come before the items, so frames paint underneath
  const canvasKids = [...document.getElementById('canvas').children].map(n => n.id || n.className);
  ok('frame layer paints below the items', canvasKids[0] === 'frame-layer', canvasKids.slice(0, 3).join(','));

  Object.assign(fr, { x: 1024, y: 1024, w: 256, h: 256 });
  A.renderTransforms();
  const frInside = A.addInstance('sun.png', 1088, 1088);
  const frOutside = A.addInstance('sun.png', 1600, 1000);
  await frame();

  ok('the frame carries what stands on it', A.itemsInFrame(fr).some(i => i.id === frInside.id));
  ok('the frame ignores what stands outside it', !A.itemsInFrame(fr).some(i => i.id === frOutside.id));

  const frEdge = () => document.querySelector(`.frame[data-id="${fr.id}"] .frame-edge[data-edge="top"]`);
  await dragFrom(frEdge(), { x: 1152, y: 1024 }, { x: 1216, y: 1088 });
  ok('dragging an edge moves the frame', fr.x === 1088 && fr.y === 1088, `(${fr.x},${fr.y})`);
  ok('contents move with the frame', byId(frInside.id).x === 1152 && byId(frInside.id).y === 1152,
     `(${byId(frInside.id).x},${byId(frInside.id).y})`);
  ok('items outside stay put', byId(frOutside.id).x === 1600 && byId(frOutside.id).y === 1000,
     `(${byId(frOutside.id).x},${byId(frOutside.id).y})`);

  const frHandle = () => document.querySelector(`.frame[data-id="${fr.id}"] .frame-handle[data-dir="se"]`);
  await dragFrom(frHandle(), { x: 1344, y: 1344 }, { x: 1408, y: 1376 });
  ok('the se handle resizes the frame', fr.w === 320 && fr.h === 288, `${fr.w}x${fr.h}`);
  ok('resizing leaves the opposite corner alone', fr.x === 1088 && fr.y === 1088, `(${fr.x},${fr.y})`);
  ok('resizing does not move the contents', byId(frInside.id).x === 1152, String(byId(frInside.id).x));

  // a resize handle cannot shrink a frame past the minimum
  await dragFrom(frHandle(), { x: 1408, y: 1376 }, { x: 1024, y: 1024 });
  ok('a frame cannot be resized below the minimum', fr.w >= A.FRAME_MIN && fr.h >= A.FRAME_MIN,
     `${fr.w}x${fr.h}`);

  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true }));
  await frame();
  const frUndone = A.state.frames.find(f => f.id === fr.id);
  ok('undo restores the frame size', frUndone && frUndone.w === 320 && frUndone.h === 288,
     `${frUndone?.w}x${frUndone?.h}`);

  // Undo restores cloned frames, so anything after an undo has to re-look-up.
  const frNow = () => A.state.frames.find(f => f.id === fr.id);

  // A click on a frame that moves nothing must not cost a history step: the
  // next Ctrl+Z has to reach past it, to the resize before it.
  const frClick = pt(frNow().x + frNow().w / 2, frNow().y);
  ev('pointerdown', frEdge(), frClick);
  await frame();
  ev('pointerup', vp, frClick);
  await frame();
  ok('a click on a frame moves nothing', frNow().w === 320 && frNow().h === 288,
     `${frNow().w}x${frNow().h}`);
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true }));
  await frame();
  ok('a click on a frame costs no undo step', frNow().w === 256 && frNow().h === 256,
     `${frNow().w}x${frNow().h}`);
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'y', ctrlKey: true, bubbles: true }));
  await frame();
  ok('redo brings the resize back', frNow().w === 320 && frNow().h === 288,
     `${frNow().w}x${frNow().h}`);

  // renaming: a second click on the title opens the field in place
  const frTitle = () => document.querySelector(`.frame[data-id="${fr.id}"] .frame-title`);
  const titleAt = () => pt(frNow().x + frNow().w / 2, frNow().y);
  ev('pointerdown', frTitle(), { ...titleAt(), detail: 2 });
  await frame();
  ok('a second click on the title opens the rename field', frTitle().isContentEditable === true);
  ok('the open field is marked as editing', frTitle().classList.contains('editing'));

  frTitle().textContent = 'Weather';
  frTitle().dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
  await frame();
  ok('Enter commits the new title', frNow().title === 'Weather', String(frNow().title));
  ok('the field closes after committing', frTitle().isContentEditable === false);

  const frSelBefore = A.state.frameSelection.size;
  ev('pointerdown', frTitle(), { ...titleAt(), detail: 2 });
  await frame();
  frTitle().textContent = 'Scratch';
  frTitle().dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
  await frame();
  ok('Esc reverts the title', frNow().title === 'Weather', String(frNow().title));
  ok('Esc restores the displayed text', frTitle().textContent === 'Weather', frTitle().textContent);
  ok('rename keys do not leak to the board', A.state.frameSelection.size === frSelBefore,
     `${frSelBefore} -> ${A.state.frameSelection.size}`);

  window.dispatchEvent(new KeyboardEvent('keydown', { key: 's', ctrlKey: true, bubbles: true }));
  for (let i = 0; i < 100 && A.state.dirty; i++) await new Promise(r => setTimeout(r, 20));
  const frSaved = await (await fetch('/files')).json();
  ok('frames persist to the layout file', (frSaved.layout?.frames || []).length === 1,
     JSON.stringify(frSaved.layout?.frames));
  ok('the frame title persists', frSaved.layout?.frames?.[0]?.title === 'Weather',
     String(frSaved.layout?.frames?.[0]?.title));

  const frItemsBefore = A.state.items.length;
  A.setFrameSelection([fr.id]);
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Delete', bubbles: true }));
  await frame();
  ok('Delete removes the frame', A.state.frames.length === 0, `got ${A.state.frames.length}`);
  ok('Delete keeps what stood inside it', A.state.items.length === frItemsBefore,
     `${frItemsBefore} -> ${A.state.items.length}`);


  // ---- lines --------------------------------------------------------------
  note('lines');
  A.setSelection([]);
  const lnA = A.addInstance('sun.png', 2048, 2048);
  const lnB = A.addInstance('gear.png', 2432, 2048);
  const lnC = A.addInstance('star.png', 2048, 2432);
  await frame();

  const canvasOrder = [...document.getElementById('canvas').children].map(n => n.id || n.className);
  ok('lines paint above frames and below the icons',
     canvasOrder.indexOf('frame-layer') === 0 && canvasOrder.indexOf('line-layer') === 1
     && canvasOrder.indexOf('item') > 1, canvasOrder.slice(0, 4).join(','));

  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'l', bubbles: true }));
  await frame();
  ok('L enters the line tool', A.isLineMode() === true);
  ok('the viewport shows the tool is armed', vp.classList.contains('line-mode'));

  const lnClick = (id) => {
    const it = byId(id);
    const e = el(id);
    ev('pointerdown', e, pt(it.x + (e._w || 64) / 2, it.y + (e._h || 64) / 2));
  };

  lnClick(lnA.id);
  await frame();
  ok('the first click arms an anchor', A.pendingLineAnchor() === lnA.id, String(A.pendingLineAnchor()));
  ok('the anchor icon is marked', el(lnA.id).classList.contains('line-anchor'));
  ok('no line exists yet', A.state.lines.length === 0);

  lnClick(lnB.id);
  await frame();
  ok('the second click draws the line', A.state.lines.length === 1, `got ${A.state.lines.length}`);
  ok('the line records both endpoints',
     A.state.lines[0].a === lnA.id && A.state.lines[0].b === lnB.id);
  ok('the anchor is cleared after connecting', A.pendingLineAnchor() === null);
  ok('the tool stays armed for the next line', A.isLineMode() === true);

  const lnEl = (id) => document.querySelector(`.line-group[data-id="${id}"] .line`);
  const lnCoords = (id) => {
    const e = lnEl(id);
    return ['x1', 'y1', 'x2', 'y2'].map(k => Number(e.getAttribute(k)));
  };
  const centre = (id) => {
    const it = byId(id), e = el(id);
    return [it.x + (e._w || 64) / 2, it.y + (e._h || 64) / 2];
  };
  const ln1 = A.state.lines[0];
  ok('the line runs centre to centre',
     String(lnCoords(ln1.id)) === String([...centre(lnA.id), ...centre(lnB.id)]),
     `${lnCoords(ln1.id)} vs ${[...centre(lnA.id), ...centre(lnB.id)]}`);

  // several lines may leave the same icon
  lnClick(lnA.id);
  await frame();
  lnClick(lnC.id);
  await frame();
  ok('a second line can leave the same icon', A.state.lines.length === 2, `got ${A.state.lines.length}`);
  ok('both lines start from the same icon',
     A.state.lines.filter(l => l.a === lnA.id || l.b === lnA.id).length === 2);

  // an existing pair is refused, either way round
  lnClick(lnB.id);
  await frame();
  lnClick(lnA.id);
  await frame();
  ok('an already-connected pair is refused', A.state.lines.length === 2, `got ${A.state.lines.length}`);

  // clicking the anchor again cancels
  lnClick(lnA.id);
  await frame();
  lnClick(lnA.id);
  await frame();
  ok('clicking the anchor twice cancels', A.pendingLineAnchor() === null && A.state.lines.length === 2);

  // Esc drops a half-drawn line first, and only then leaves the tool
  lnClick(lnA.id);
  await frame();
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await frame();
  ok('Esc drops the half-drawn line', A.pendingLineAnchor() === null && A.isLineMode() === true);
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await frame();
  ok('a second Esc leaves the tool', A.isLineMode() === false);
  ok('the crosshair cursor is dropped with the tool', !vp.classList.contains('line-mode'));

  // the line follows whichever end moves
  await dragFrom(el(lnB.id), { x: byId(lnB.id).x + 8, y: byId(lnB.id).y + 8 },
                             { x: byId(lnB.id).x + 72, y: byId(lnB.id).y + 8 });
  await frame();
  ok('the line follows the icon that moved',
     String(lnCoords(ln1.id).slice(2)) === String(centre(lnB.id)),
     `${lnCoords(ln1.id).slice(2)} vs ${centre(lnB.id)}`);

  // a line is clickable and deletable on its own
  const lnMid = pt((lnCoords(ln1.id)[0] + lnCoords(ln1.id)[2]) / 2,
                   (lnCoords(ln1.id)[1] + lnCoords(ln1.id)[3]) / 2);
  ev('pointerdown', document.querySelector(`.line-group[data-id="${ln1.id}"] .line-hit`), lnMid);
  await frame();
  ok('clicking a line selects it', A.state.lineSelection.has(ln1.id));
  ok('selecting a line clears the item selection', A.state.selection.size === 0);

  const lnItemsBefore = A.state.items.length;
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Delete', bubbles: true }));
  await frame();
  ok('Delete removes the selected line', A.state.lines.length === 1, `got ${A.state.lines.length}`);
  ok('deleting a line keeps both icons', A.state.items.length === lnItemsBefore);

  // deleting an icon takes its connectors with it
  A.setSelection([lnC.id]);
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Delete', bubbles: true }));
  await frame();
  ok('deleting an icon drops the lines that reached it', A.state.lines.length === 0,
     `got ${A.state.lines.length}`);

  // duplication copies a line only when both of its ends are copied
  A.setSelection([]);
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'l', bubbles: true }));
  await frame();
  lnClick(lnA.id);
  await frame();
  lnClick(lnB.id);
  await frame();
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await frame();
  A.setSelection([lnA.id, lnB.id]);
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'd', ctrlKey: true, bubbles: true }));
  await frame();
  ok('duplicating both ends copies the line', A.state.lines.length === 2, `got ${A.state.lines.length}`);
  const lnCopy = A.state.lines.find(l => l.a !== lnA.id);
  ok('the copy connects the copies, not the originals',
     !!lnCopy && lnCopy.a !== lnA.id && lnCopy.b !== lnB.id);

  A.setSelection([]);
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 's', ctrlKey: true, bubbles: true }));
  for (let i = 0; i < 100 && A.state.dirty; i++) await new Promise(r => setTimeout(r, 20));
  const lnSaved = await (await fetch('/files')).json();
  ok('lines persist to the layout file', (lnSaved.layout?.lines || []).length === 2,
     JSON.stringify(lnSaved.layout?.lines));

  // the tool takes a drag as readily as two clicks, and forgives a near miss:
  // in line mode the gesture goes by pointer position, not by what it landed on
  const centreW = (id) => {
    const it = byId(id), e = el(id);
    return { x: it.x + (e._w || 64) / 2, y: it.y + (e._h || 64) / 2 };
  };
  const lnDown = (wx, wy) => ev('pointerdown', vp, pt(wx, wy));
  const lnUp = (wx, wy) => ev('pointerup', vp, pt(wx, wy));

  A.setSelection([]);
  const lnD = A.addInstance('dot.png', 2900, 2048);
  const lnE = A.addInstance('pause.png', 3300, 2048);
  await frame();
  const lnBefore = A.state.lines.length;
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'l', bubbles: true }));
  await frame();

  const dC = centreW(lnD.id), eC = centreW(lnE.id);
  lnDown(dC.x, dC.y);
  await frame();
  ev('pointermove', vp, pt((dC.x + eC.x) / 2, dC.y));
  await frame();
  lnUp(eC.x, eC.y);
  await frame();
  ok('dragging from one icon onto another connects them',
     A.state.lines.length === lnBefore + 1, `got ${A.state.lines.length}`);

  // dot.png is 16px square, so a click a few px off it is the normal case
  const lnG = A.addInstance('dot.png', 2900, 2400);
  const lnH = A.addInstance('dot.png', 3300, 2400);
  await frame();
  const lnBefore2 = A.state.lines.length;
  const gC = centreW(lnG.id), hC = centreW(lnH.id);
  ok('the near-miss fixture really is tiny', (el(lnG.id)._w || 64) <= 24,
     String(el(lnG.id)._w));
  // The slack is measured in screen px, so the miss has to be too -- the suite
  // is zoomed in by this point, and 6 world px would be a genuinely far miss.
  const missW = 6 / A.state.view.zoom;
  const gMiss = gC.x + (el(lnG.id)._w || 64) / 2 + missW;
  const hMiss = hC.x + (el(lnH.id)._w || 64) / 2 + missW;
  lnDown(gMiss, gC.y);
  await frame();
  lnUp(gMiss, gC.y);
  await frame();
  ok('a near miss still arms the anchor', A.pendingLineAnchor() === lnG.id,
     String(A.pendingLineAnchor()));
  lnDown(hMiss, hC.y);
  await frame();
  lnUp(hMiss, hC.y);
  await frame();
  ok('a near miss still connects', A.state.lines.length === lnBefore2 + 1,
     `got ${A.state.lines.length}`);

  // a stray click on bare canvas must not silently throw the anchor away
  const lnBefore3 = A.state.lines.length;
  lnDown(gC.x, gC.y);
  await frame();
  lnUp(gC.x, gC.y);
  await frame();
  ok('press and release on one icon leaves it armed', A.pendingLineAnchor() === lnG.id);
  lnDown(gC.x, gC.y - 300);
  await frame();
  lnUp(gC.x, gC.y - 300);
  await frame();
  ok('a stray click keeps the half-drawn line', A.pendingLineAnchor() === lnG.id,
     String(A.pendingLineAnchor()));
  lnDown(eC.x, eC.y);
  await frame();
  lnUp(eC.x, eC.y);
  await frame();
  ok('the line still completes after a stray click',
     A.state.lines.length === lnBefore3 + 1, `got ${A.state.lines.length}`);

  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await frame();
  ok('the tool is put away again', A.isLineMode() === false);

  // Lines pass behind the icons, so two icons sitting close together bury the
  // whole connector. That must be said out loud, not left looking broken.
  const lnStatus = () => document.getElementById('statusbar').textContent;
  A.setSelection([]);
  const lnNear1 = A.addInstance('sun.png', 3800, 2048);
  const lnNear2 = A.addInstance('sun.png', 3864, 2048);   // one 64px cell over
  await frame();
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'l', bubbles: true }));
  await frame();
  const n1 = centreW(lnNear1.id), n2 = centreW(lnNear2.id);
  lnDown(n1.x, n1.y); await frame(); lnUp(n1.x, n1.y); await frame();
  lnDown(n2.x, n2.y); await frame(); lnUp(n2.x, n2.y); await frame();
  const lnHidden = A.state.lines[A.state.lines.length - 1];
  ok('touching icons still make a line', lnHidden.a === lnNear1.id && lnHidden.b === lnNear2.id);
  ok('the buried connector is reported as hidden', A.lineIsHidden(lnHidden) === true);
  ok('the status bar says so', /hidden/.test(lnStatus()), lnStatus());

  // trying the same pair again points at the line that is already there
  lnDown(n1.x, n1.y); await frame(); lnUp(n1.x, n1.y); await frame();
  lnDown(n2.x, n2.y); await frame(); lnUp(n2.x, n2.y); await frame();
  ok('a repeat selects the existing line', A.state.lineSelection.has(lnHidden.id),
     `sel=${A.state.lineSelection.size}`);
  ok('a repeat says both already-connected and hidden',
     /already connected/.test(lnStatus()) && /hidden/.test(lnStatus()),
     lnStatus());

  // a line with room to show must not claim to be hidden
  ok('a line with room to show is not hidden', A.lineIsHidden(ln1) === false);

  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await frame();

  // a shell that has lost a layer heals itself rather than swallowing lines
  document.getElementById('line-layer').remove();
  A.render();
  await frame();
  ok('a missing #line-layer is rebuilt', !!document.getElementById('line-layer'));
  ok('existing lines draw into the rebuilt layer',
     document.querySelectorAll('#line-layer .line').length === A.state.lines.length,
     `${document.querySelectorAll('#line-layer .line').length} of ${A.state.lines.length}`);
  const healed = [...document.getElementById('canvas').children].map(n => n.id || n.className);
  ok('the rebuilt layer lands back under the icons',
     healed[0] === 'frame-layer' && healed[1] === 'line-layer', healed.slice(0, 3).join(','));

  // A zero-sized outermost <svg> paints nothing no matter what `overflow` says,
  // which once made every line and every group hull invisible. Guard the
  // viewport itself, not just the elements drawn into it.
  for (const id of ['line-layer', 'hull-layer']) {
    const layer = document.getElementById(id);
    const r = layer.getBoundingClientRect();
    ok(`#${id} has a paintable viewport`, r.width > 1000 && r.height > 1000,
       `${Math.round(r.width)}x${Math.round(r.height)}`);
    // The client rect carries the canvas zoom, so the viewBox maps 1:1 onto
    // world units exactly when box / zoom matches it.
    const z = A.state.view.zoom;
    ok(`#${id} maps its viewBox 1:1 onto world units`,
       Math.abs(r.width / z - layer.viewBox.baseVal.width) < 1
       && Math.abs(r.height / z - layer.viewBox.baseVal.height) < 1,
       `viewBox ${layer.viewBox.baseVal.width} vs box/zoom ${Math.round(r.width / z)}`);
  }

  // and a drawn line has to fall inside that viewport, negatives included
  A.setSelection([]);
  const lnNeg1 = A.addInstance('sun.png', -1200, -900);
  const lnNeg2 = A.addInstance('gear.png', -600, -500);
  await frame();
  A.state.lines.push({ id: 'neg-line', a: lnNeg1.id, b: lnNeg2.id });
  A.render();
  await frame();
  const negEl = document.querySelector('.line-group[data-id="neg-line"] .line');
  ok('a line at negative coordinates is drawn', !!negEl);
  if (negEl) {
    const lr = negEl.getBoundingClientRect();
    const vr = document.getElementById('line-layer').getBoundingClientRect();
    ok('it falls inside the layer viewport',
       lr.left >= vr.left - 1 && lr.top >= vr.top - 1
       && lr.right <= vr.right + 1 && lr.bottom <= vr.bottom + 1,
       `line ${Math.round(lr.left)},${Math.round(lr.top)} in ${Math.round(vr.left)},${Math.round(vr.top)}`);
    ok('and it has real extent', lr.width > 100 && lr.height > 100,
       `${Math.round(lr.width)}x${Math.round(lr.height)}`);
  }


} catch (err) {
  fail++;
  out.push(`FAIL  threw: ${err && err.stack ? err.stack : err}`);
}

out.push('', `${pass} passed, ${fail} failed`);
flush();
document.title = `selftest ${pass}/${pass + fail}`;
</script>
